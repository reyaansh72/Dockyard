name: Dockyard Verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 20
          - 22

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Verify Node version
        run: node --version

      - name: Validate package.json
        run: node -e "JSON.parse(require('fs').readFileSync('package.json', 'utf8')); console.log('package.json: valid')"

      - name: Validate image catalog
        run: |
          node -e "
            const fs = require('fs');
            const data = JSON.parse(fs.readFileSync('config/images.json', 'utf8'));

            if (!data || typeof data !== 'object') {
              throw new Error('config/images.json must contain an object');
            }

            if (!Array.isArray(data.images)) {
              throw new Error('config/images.json must contain an images array');
            }

            for (const [index, image] of data.images.entries()) {
              if (!image || typeof image !== 'object') {
                throw new Error('Image entry ' + index + ' is invalid');
              }

              if (typeof image.image !== 'string' || !image.image.trim()) {
                throw new Error('Image entry ' + index + ' is missing an image reference');
              }
            }

            console.log('config/images.json: valid');
            console.log('Image entries:', data.images.length);
          "

      - name: Verify required files
        run: |
          test -f package.json
          test -f README.md
          test -f src/server.js
          test -f public/index.html
          test -f public/app.js
          test -f public/styles.css
          test -f config/images.json

      - name: Run built-in syntax checks
        run: npm run check

      - name: Check JavaScript files
        run: |
          find src public -type f -name '*.js' -print0 |
            xargs -0 -n1 node --check

      - name: Start Dockyard
        env:
          PORT: 3100
          HOST: 127.0.0.1
        run: |
          npm start > dockyard.log 2>&1 &
          echo $! > dockyard.pid

      - name: Wait for server
        run: |
          for i in {1..30}; do
            if curl --silent --fail http://127.0.0.1:3100/ > /dev/null; then
              echo "Dockyard is responding"
              exit 0
            fi

            sleep 1
          done

          echo "Dockyard failed to start"
          cat dockyard.log
          exit 1

      - name: Verify web interface
        run: |
          curl --silent --fail \
            --output /tmp/index.html \
            http://127.0.0.1:3100/

          grep -qi '<html' /tmp/index.html
          grep -qi 'Dockyard' /tmp/index.html

      - name: Verify unauthenticated API protection
        run: |
          status=$(curl \
            --silent \
            --output /tmp/session.json \
            --write-out '%{http_code}' \
            http://127.0.0.1:3100/api/overview)

          test "$status" = "401"

          grep -q 'message' /tmp/session.json

      - name: Verify session endpoint
        run: |
          curl --silent --fail \
            http://127.0.0.1:3100/api/session \
            > /tmp/session-info.json

          node -e "
            const fs = require('fs');
            const data = JSON.parse(fs.readFileSync('/tmp/session-info.json', 'utf8'));

            if (typeof data.configured !== 'boolean') {
              throw new Error('Session endpoint missing configured field');
            }

            if (data.authenticated !== false) {
              throw new Error('Expected unauthenticated session');
            }

            console.log('Session endpoint: valid');
          "

      - name: Show server log on failure
        if: failure()
        run: |
          echo "===== Dockyard server log ====="
          cat dockyard.log || true

      - name: Stop Dockyard
        if: always()
        run: |
          if [ -f dockyard.pid ]; then
            kill "$(cat dockyard.pid)" 2>/dev/null || true
          fi
