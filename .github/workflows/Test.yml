name: Dockyard CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    name: Verify Dockyard
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check Node version
        run: node --version

      - name: Validate package.json
        run: node -e "JSON.parse(require('fs').readFileSync('package.json', 'utf8')); console.log('package.json OK')"

      - name: Check required files
        run: |
          test -f package.json
          test -f src/server.js
          test -f public/app.js
          test -f public/index.html
          test -f public/styles.css
          test -f config/images.json
          echo "Required files OK"

      - name: Validate images configuration
        run: node -e "JSON.parse(require('fs').readFileSync('config/images.json', 'utf8')); console.log('images.json OK')"

      - name: Run Dockyard tests
        run: npm run check

      - name: Syntax check all JavaScript
        run: |
          find src public -type f -name '*.js' -print0 | while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done

      - name: Start Dockyard
        run: |
          npm start > dockyard.log 2>&1 &
          echo $! > dockyard.pid

      - name: Wait for Dockyard
        run: |
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/ > /dev/null; then
              echo "Dockyard is running"
              exit 0
            fi
            sleep 1
          done

          echo "Dockyard failed to start"
          cat dockyard.log
          exit 1

      - name: Test web interface
        run: |
          curl -fsS http://127.0.0.1:3000/ > /tmp/dockyard.html
          grep -qi "Dockyard" /tmp/dockyard.html
          echo "Web interface OK"

      - name: Show logs if something fails
        if: failure()
        run: cat dockyard.log || true

      - name: Stop Dockyard
        if: always()
        run: |
          if [ -f dockyard.pid ]; then
            kill "$(cat dockyard.pid)" 2>/dev/null || true
          fi
